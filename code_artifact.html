    let currentPageIndex = 0;

    const DB_NAME = "tutorial_storage_db";
    const DB_STORE = "images_store";

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE, { keyPath: "pageId" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveImageToDB(pageId, blob, filename) {
      try {
        const db = await openDatabase();
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put({ pageId, blob, filename, savedAt: Date.now() });
      } catch (err) {
        console.warn("IndexedDB 保存エラー:", err);
      }
    }

    async function loadImageFromDB(pageId) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(DB_STORE, "readonly");
          const req = tx.objectStore(DB_STORE).get(pageId);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (err) {
        return null;
      }
    }

    async function clearAllImageCache() {
      try {
        const db = await openDatabase();
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).clear();
      } catch (err) {
        console.warn("IndexedDB クリアエラー:", err);
      }
    }

    const stageBgImg = document.getElementById("stage-bg-image");
    const tutorialStage = document.getElementById("tutorial-stage");
    const slideFirstOverlay = document.getElementById("slide-first-overlay");
    const dimmerOverlay = document.getElementById("dimmer-overlay");
    const hotspotFrame = document.getElementById("hotspot-frame");
    const hotspotBadge = document.getElementById("hotspot-badge");
    const guideTooltip = document.getElementById("guide-tooltip");
    const actionLinksContainer = document.getElementById("action-links-container");
    const slideOnlyBar = document.getElementById("slide-only-bar");
    const toast = document.getElementById("toast");
    const fileInput = document.getElementById("image-file-input");
    const storageBadge = document.getElementById("storage-status-badge");

    // Tooltip elements
    const tooltipCounter = document.getElementById("tooltip-counter");
    const tooltipTitle = document.getElementById("tooltip-title");
    const tooltipDesc = document.getElementById("tooltip-desc");
    const tooltipTip = document.getElementById("tooltip-tip");
    const btnTooltipPrev = document.getElementById("btn-tooltip-prev");
    const btnTooltipNext = document.getElementById("btn-tooltip-next");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("opacity-0", "translate-y-3");
      toast.classList.add("opacity-100", "translate-y-0");
      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-3");
      }, 2500);
    }

    function renderCurrentView() {
      const page = pagesData[currentPageIndex];

      // Update Tab Styles
      for (let i = 1; i <= 8; i++) {
        const btn = document.getElementById(`btn-page-${i}`);
        if (btn) {
          if (i - 1 === currentPageIndex) {
            btn.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-blue-600 text-white shadow transition whitespace-nowrap";
          } else {
            btn.className = "px-2.5 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition whitespace-nowrap";
          }
        }
      }

      // Hide all contextual layers by default
      hotspotFrame.classList.add("hidden");
      guideTooltip.classList.add("hidden");
      actionLinksContainer.classList.add("hidden");
      slideOnlyBar.classList.add("hidden");
      slideFirstOverlay.classList.add("hidden");
      dimmerOverlay.classList.remove("opacity-100");
      dimmerOverlay.classList.add("opacity-0");

      if (page.isActionPage) {
        actionLinksContainer.classList.remove("hidden");
        return;
      }

      if (page.isSlideOnly) {
        slideOnlyBar.classList.remove("hidden");
        return;
      }

      // Guide-enabled pages: if guide not active, show the slide-first overlay
      if (!isGuideActive) {
        slideFirstOverlay.classList.remove("hidden");
        return;
      }

      // Guide mode active
      dimmerOverlay.classList.remove("opacity-0");
      dimmerOverlay.classList.add("opacity-100");

      const step = page.steps[currentStepIndex];
      if (!step) return;

      hotspotFrame.classList.remove("hidden");
      guideTooltip.classList.remove("hidden");

      hotspotFrame.style.top = step.top;
      hotspotFrame.style.left = step.left;
      hotspotFrame.style.width = step.width;
      hotspotFrame.style.height = step.height;
      hotspotBadge.textContent = `Step ${step.id}`;

      tooltipCounter.textContent = `${currentStepIndex + 1} / ${page.steps.length}`;
      tooltipTitle.textContent = step.title;
      tooltipDesc.textContent = step.desc;
      tooltipTip.textContent = step.tip;

      btnTooltipPrev.textContent = currentStepIndex === 0 ? "全体表示へ" : "前へ";
      btnTooltipNext.textContent = currentStepIndex === page.steps.length - 1 ? "次のページへ" : "次へ";

      // Position tooltip based on step coordinate with stage clamping
      if (step.tooltipPos) {
        guideTooltip.style.top = step.tooltipPos.top;
        guideTooltip.style.left = step.tooltipPos.left;
      }

      requestAnimationFrame(() => {
        clampTooltipInStage();
      });
    }

    function clampTooltipInStage() {
      const stageRect = tutorialStage.getBoundingClientRect();
      const tipRect = guideTooltip.getBoundingClientRect();
      if (!stageRect.width || !tipRect.width) return;

      let leftPx = tipRect.left - stageRect.left;
      let topPx = tipRect.top - stageRect.top;

      const padding = 12;
      if (leftPx < padding) leftPx = padding;
      if (leftPx + tipRect.width > stageRect.width - padding) {
        leftPx = stageRect.width - tipRect.width - padding;
      }
      if (topPx < padding) topPx = padding;
      if (topPx + tipRect.height > stageRect.height - padding) {
        topPx = stageRect.height - tipRect.height - padding;
      }

      guideTooltip.style.left = `${(leftPx / stageRect.width) * 100}%`;
      guideTooltip.style.top = `${(topPx / stageRect.height) * 100}%`;
    }

    function applyImageSource(sourceUrl) {
      stageBgImg.onerror = () => {
        console.info(`画像 ${sourceUrl} が未検出のため、デモ用SVGを表示します。`);
        stageBgImg.onerror = null;
        stageBgImg.src = createFallbackSvg(currentPageIndex);
      };

      stageBgImg.onload = () => {
        if (stageBgImg.naturalWidth && stageBgImg.naturalHeight) {
          tutorialStage.style.aspectRatio = `${stageBgImg.naturalWidth} / ${stageBgImg.naturalHeight}`;
        }
        renderCurrentView();
      };

      stageBgImg.src = sourceUrl;
    }

    async function switchPage(pageIdx) {
      if (pageIdx < 0 || pageIdx >= pagesData.length) return;
      currentPageIndex = pageIdx;
      currentStepIndex = 0;
      isGuideActive = false;

      const saved = await loadImageFromDB(pagesData[currentPageIndex].id);
      if (saved && saved.blob) {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(saved.blob);
        storageBadge.classList.remove("hidden");
        applyImageSource(currentObjectUrl);
      } else {
        storageBadge.classList.add("hidden");
        applyImageSource(pagesData[currentPageIndex].imageSrc);
      }

      renderCurrentView();
    }

    function advanceStep() {
      const page = pagesData[currentPageIndex];
      if (!page || page.isSlideOnly || page.isActionPage) return;

      if (!isGuideActive) {
        isGuideActive = true;
        currentStepIndex = 0;
        renderCurrentView();
        return;
      }

      if (currentStepIndex < page.steps.length - 1) {
        currentStepIndex++;
        renderCurrentView();
      } else {
        if (currentPageIndex < pagesData.length - 1) {
          switchPage(currentPageIndex + 1);
        }
      }
    }

    function stepBack() {
      const page = pagesData[currentPageIndex];
      if (!page || page.isSlideOnly || page.isActionPage) return;

      if (!isGuideActive) return;

      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderCurrentView();
      } else {
        // Return to whole-slide preview
        isGuideActive = false;
        renderCurrentView();
      }
    }

    // Tab clicks
    for (let i = 1; i <= 8; i++) {
      const btn = document.getElementById(`btn-page-${i}`);
      if (btn) {
        btn.addEventListener("click", () => switchPage(i - 1));
      }
    }

    // Overlay to start guide
    slideFirstOverlay.addEventListener("click", () => {
      isGuideActive = true;
      currentStepIndex = 0;
      renderCurrentView();
    });

    // Hotspot click
    hotspotFrame.addEventListener("click", (e) => {
      e.stopPropagation();
      advanceStep();
    });

    // Tooltip navigation
    btnTooltipPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      stepBack();
    });

    btnTooltipNext.addEventListener("click", (e) => {
      e.stopPropagation();
      advanceStep();
    });

    // Slide-only bottom navigation
    document.getElementById("btn-slide-prev").addEventListener("click", () => {
      if (currentPageIndex > 0) switchPage(currentPageIndex - 1);
    });

    document.getElementById("btn-slide-next").addEventListener("click", () => {
      if (currentPageIndex < pagesData.length - 1) {
        switchPage(currentPageIndex + 1);
      } else {
        switchPage(0);
      }
    });

    // File input handlers
    document.getElementById("btn-select-file").addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const pageId = pagesData[currentPageIndex].id;
      await saveImageToDB(pageId, file, file.name);

      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(file);

      storageBadge.classList.remove("hidden");
      applyImageSource(currentObjectUrl);
      showToast(`${file.name} を保存・適用しました`);
      fileInput.value = "";
    });

    // Cache reset
    document.getElementById("btn-reset-cache").addEventListener("click", async () => {
      await clearAllImageCache();
      storageBadge.classList.add("hidden");
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
      applyImageSource(pagesData[currentPageIndex].imageSrc);
      showToast("保存画像をリセットし初期状態に戻しました");
    });

    // Keyboard navigation
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        const page = pagesData[currentPageIndex];
        if (page.isSlideOnly) {
          if (currentPageIndex < pagesData.length - 1) switchPage(currentPageIndex + 1);
        } else {
          advanceStep();
        }
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        const page = pagesData[currentPageIndex];
        if (page.isSlideOnly) {
          if (currentPageIndex > 0) switchPage(currentPageIndex - 1);
        } else {
          stepBack();
        }
      }
    });

    window.addEventListener("resize", () => {
      if (isGuideActive) clampTooltipInStage();
    });

    // Initial load
    window.addEventListener("DOMContentLoaded", () => {
      switchPage(0);
    });
  </script>
